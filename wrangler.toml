# CI Workers Builds project name (repo: warzone-cheats-.org → Worker: warzone-cheats--org)
name = "warzone-cheats--org"
compatibility_date = "2026-01-01"
main = "src/worker.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Run Worker first so www/http → https://warzonecheats.org 301s always apply
run_worker_first = true
